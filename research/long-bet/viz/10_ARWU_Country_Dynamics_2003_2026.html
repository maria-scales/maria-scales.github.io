  .country-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 11px; }

  .note { font-size: 0.8125rem; color: #4b5563; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 16px; line-height: 1.65; margin-top: 4px; }

const YEARS = DATA.meta.years;
const T = DATA.text;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function toggleButton(label, color, onClick) {
  const btn = el('button', 'toggle-btn');
  btn.style.borderColor = color;
  const dot = el('span', 'toggle-dot');
  dot.style.background = color;
  btn.appendChild(dot);
  btn.appendChild(document.createTextNode(label));
  btn.addEventListener('click', onClick);
  return btn;
}
function bulkButtons(container, chart, buttons) {
  [[T.show_all, false], [T.hide_all, true]].forEach(([label, hide]) => {
    const b = el('button', 'toggle-btn bulk', label);
    b.addEventListener('click', () => {
      chart.data.datasets.forEach(ds => { ds.hidden = hide; });
      buttons.forEach(x => x.classList.toggle('off', hide));
      chart.update();
    });
    container.appendChild(b);
  });
}
function fillCards(container, items, cls) {
  items.forEach(s => {
    const div = el('div', cls);
    const head = el('div', cls === 'callout' ? 'callout-title' : 'stat-label');
    const dot = el('span', 'card-dot'); dot.style.background = s.color;
    head.appendChild(dot); head.appendChild(document.createTextNode(s.title || s.label));
    div.appendChild(head);
    if (cls === 'callout') {
      div.appendChild(el('div', 'callout-body', s.body));
    } else {
      div.appendChild(el('div', 'stat-value', s.value));
      div.appendChild(el('div', 'stat-desc', s.desc));
    }
    container.appendChild(div);
  });
}
function fillNotes(container, heading, items) {
  const ul = el('ul');
  items.forEach(html => { const li = el('li'); li.innerHTML = html; ul.appendChild(li); });
  container.appendChild(ul);
}

document.getElementById('notesSum1').textContent = T.notes_heading;
document.getElementById('notesSum2').textContent = T.notes_heading;
document.getElementById('tabBtn1').textContent = T.tab1_label;
document.getElementById('tabBtn2').textContent = T.tab2_label;

const INK = '#111827', MUTED = '#6b7280', RULE = '#e5e7eb', GRID = '#f3f4f6';
const baseTooltip = {
  backgroundColor: '#ffffff', borderColor: RULE, borderWidth: 1,
  titleColor: INK, bodyColor: '#4b5563', padding: 12,
  displayColors: true, boxWidth: 10, boxHeight: 10,
};
const baseScaleX = {
  grid: { color: GRID }, border: { color: RULE },
  ticks: { color: MUTED, font: { size: 11 }, maxRotation: 60, autoSkip: true }
};
// Countries named in the captions carry a palette colour and a 2px line; the rest are thin grey context lines, drawn underneath.
function lineDataset(label, color, data, focus, visible) {
  return {
    label, data, borderColor: color, backgroundColor: color,
    borderWidth: focus ? 2.2 : 1.3, pointRadius: focus ? 3 : 1.8, pointHoverRadius: 6,
    pointBackgroundColor: color, pointBorderColor: '#ffffff', pointBorderWidth: focus ? 1 : 0,
    tension: 0.2, spanGaps: false, order: focus ? 0 : 1, hidden: !visible,
  };
}

// ---------- TAB 1: best-ranked university per country ----------
const C1 = DATA.tab1.countries;
const chart1 = new Chart(document.getElementById('chart1').getContext('2d'), {
  type: 'line',
  data: { labels: YEARS, datasets: C1.map(c => lineDataset(c.flag + ' ' + c.name, c.color, c.ranks, c.focus, c.visible)) },
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'nearest', intersect: true },
    plugins: {
      legend: { display: false },
      tooltip: Object.assign({}, baseTooltip, { callbacks: {
        title: items => {
          const it = items[0], c = C1[it.datasetIndex];
          return `${c.flag}  ${c.name}  ·  ${YEARS[it.dataIndex]}`;
        },
        label: item => {
          const c = C1[item.datasetIndex], i = item.dataIndex;
          return `  #${c.ranks[i]}  ${c.unis[i]}${c.tied[i] ? '  (' + T.tied_place + ')' : ''}`;
        }
      }})
    },
    scales: {
      y: {
        reverse: true, min: DATA.meta.rank_min, max: DATA.meta.rank_max,
        title: { display: true, text: T.y1_title, color: MUTED, font: { size: 11 } },
        grid: { color: GRID }, border: { color: RULE },
        ticks: { color: MUTED, callback: v => '#' + v, stepSize: 10 }
      },
      x: baseScaleX
    }
  }
});
const tg1 = document.getElementById('toggles1');
const btns1 = C1.map((c, i) => {
  const btn = toggleButton(c.flag + ' ' + c.name, c.color, () => {
    const ds = chart1.data.datasets[i];
    ds.hidden = !ds.hidden;
    btn.classList.toggle('off', ds.hidden);
    chart1.update();
  });
  btn.classList.toggle('off', !c.visible);
  tg1.appendChild(btn);
  return btn;
});
bulkButtons(tg1, chart1, btns1);
fillNotes(document.getElementById('notes1'), T.notes_heading, DATA.tab1.notes);

// ---------- TAB 2: universities per country ----------
const C2 = DATA.tab2.series;
const TOT = DATA.tab2.totals;
const chart2 = new Chart(document.getElementById('chart2').getContext('2d'), {
  type: 'line',
  data: { labels: YEARS, datasets: C2.map(c => lineDataset(c.flag + ' ' + c.name, c.color, c.counts, c.focus, c.visible)) },
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'nearest', intersect: true },
    plugins: {
      legend: { display: false },
      tooltip: Object.assign({}, baseTooltip, { callbacks: {
        title: items => {
          const it = items[0], c = C2[it.datasetIndex];
          return `${c.flag}  ${c.name}  ·  ${YEARS[it.dataIndex]}`;
        },
        label: item => {
          const n = item.raw, tot = TOT[item.dataIndex];
          return `  ${n} of ${tot} ${tot === 1 ? 'institution' : 'institutions'}`;
        }
      }})
    },
    scales: {
      y: {
        min: 0,
        title: { display: true, text: T.y2_title, color: MUTED, font: { size: 11 } },
        grid: { color: GRID }, border: { color: RULE },
        ticks: { color: MUTED, stepSize: 5 }
      },
      x: baseScaleX
    }
  }
});
const tg2 = document.getElementById('toggles2');
const btns2 = C2.map((c, i) => {
  const btn = toggleButton(c.flag + ' ' + c.name, c.color, () => {
    const ds = chart2.data.datasets[i];
    ds.hidden = !ds.hidden;
    btn.classList.toggle('off', ds.hidden);
    chart2.update();
  });
  btn.classList.toggle('off', !c.visible);
  tg2.appendChild(btn);
  return btn;
});
bulkButtons(tg2, chart2, btns2);
fillNotes(document.getElementById('notes2'), T.notes_heading, DATA.tab2.notes);

// ---------- TAB SWITCHING ----------
function switchTab(id, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  setTimeout(() => { chart1.resize(); chart2.resize(); postHeight(); }, 10);
}
// The article page sizes the iframe to the content; the message goes only to a parent page on this site.
function postHeight() {
  if (window.parent !== window) window.parent.postMessage({ arwuChartHeight: document.documentElement.scrollHeight }, window.location.origin);
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', postHeight));
</script>
