<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STEM Uniqueness & Gaps — Top 100 ARWU</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:13px}
header{padding:22px 28px 14px;border-bottom:1px solid var(--border)}
header h1{font-size:20px;font-weight:700;color:#f1f5f9}
header p{color:var(--muted);margin-top:4px;font-size:12px}
.tabs{display:flex;gap:2px;padding:0 28px;background:#0c1524;border-bottom:1px solid var(--border)}
.tab{padding:12px 20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;transition:.15s}
.tab.active{color:#f1f5f9;border-bottom-color:var(--accent)}
.pane{display:none;padding:20px 28px}
.pane.active{display:block}
/* stats */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 16px}
.stat .v{font-size:22px;font-weight:700;color:var(--accent)}
.stat .l{font-size:11px;color:var(--muted)}
/* rarity grid */
.rarity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.rc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}
.rc:hover{border-color:var(--accent)}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.rc-name{font-size:14px;font-weight:700}
.rc-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.tag-vr{background:#FEE2E2;color:#991B1B}
.tag-r{background:#FEF3C7;color:#92400E}
.tag-u{background:#DBEAFE;color:#1E40AF}
.tag-c{background:#DCFCE7;color:#166534}
.rc-cluster{font-size:11px;color:var(--muted);margin-bottom:6px}
.rc-bar-wrap{display:flex;align-items:center;gap:8px}
.rc-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.rc-fill{height:100%;border-radius:3px}
.rc-num{font-size:12px;font-weight:700;min-width:40px;text-align:right}
.rc-unis{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.5;display:none}
.rc.open .rc-unis{display:block}
/* surprises */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.controls select,.controls input{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px}
table{width:100%;border-collapse:collapse}
th{background:#1F4E79;color:#fff;font-size:11px;font-weight:700;padding:7px 10px;text-align:left;position:sticky;top:0;z-index:10}
td{padding:6px 10px;border-bottom:1px solid #1e293b;font-size:12px;vertical-align:middle}
tr:hover td{background:#1a2744}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;color:#fff}
.pill{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;color:#fff;margin:1px}
/* country */
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.cc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.cc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cc-name{font-size:16px;font-weight:700}
.cc-count{font-size:11px;color:var(--muted)}
.cc-section{margin-top:10px}
.cc-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;padding:3px 8px;border-radius:4px;display:inline-block}
.sig-label{background:#14532D;color:#86EFAC}
.weak-label{background:#7F1D1D;color:#FCA5A5}
.cc-entry{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.cc-lift{font-size:13px;font-weight:700;min-width:42px;text-align:right}
.lift-pos{color:#4ADE80}
.lift-neg{color:#F87171}
.cc-prog{flex:1}
.cc-pcts{font-size:10px;color:var(--muted);white-space:nowrap}
.cluster-dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0}
</style>

// ── TAB LOGIC ────────────────────────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['rarity','gaps','country'][i]===id));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-'+id).classList.add('active');
  if (id==='rarity' && !document.getElementById('pane-rarity').innerHTML) renderRarity();
  if (id==='gaps'   && !document.getElementById('pane-gaps').innerHTML)   renderGaps();
  if (id==='country'&& !document.getElementById('pane-country').innerHTML) renderCountry();
}

// ── 3A: RARITY ───────────────────────────────────────────────────────────────
function renderRarity() {
  const pane = document.getElementById('pane-rarity');
  const vrare = RARITY.filter(r=>r.tag.includes('Very Rare'));
  const rare  = RARITY.filter(r=>r.tag.includes('Rare ('));
  const uncom = RARITY.filter(r=>r.tag.includes('Uncommon'));
  const comm  = RARITY.filter(r=>r.tag.includes('Common'));

  const tagClass = t => t.includes('Very')? 'tag-vr': t.includes('Rare (')? 'tag-r': t.includes('Uncommon')? 'tag-u': 'tag-c';

  let html = `<div class="stats">
    <div class="stat"><div class="v">${vrare.length}</div><div class="l">Very Rare (&lt;10 unis)</div></div>
    <div class="stat"><div class="v">${rare.length}</div><div class="l">Rare (10–24 unis)</div></div>
    <div class="stat"><div class="v">${uncom.length}</div><div class="l">Uncommon (25–49)</div></div>
    <div class="stat"><div class="v">${comm.length}</div><div class="l">Common (50+ unis)</div></div>
  </div>`;

  for (const [group, label] of [[vrare,'Very Rare'],[rare,'Rare'],[uncom,'Uncommon'],[comm,'Common (50+)']]) {
    if (!group.length) continue;
    html += `<h3 style="color:#94a3b8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 10px">${label}</h3><div class="rarity-grid">`;
    for (const r of group) {
      const clr = CLUSTER_COLORS[r.cluster] || '#64748B';
      const tcls = tagClass(r.tag);
      const pct = Math.round(r.pct);
      const unis = r.universities.slice(0,15).map(([rk,n])=>`<span class="pill" style="background:#1e293b;color:#94a3b8;border:1px solid #334155">#${rk} ${n}</span>`).join('');
      html += `<div class="rc" onclick="this.classList.toggle('open')">
        <div class="rc-top">
          <div class="rc-name">${r.programme}</div>
          <span class="rc-tag ${tcls}">${r.tag}</span>
        </div>
        <div class="rc-cluster" style="color:${clr}">${r.cluster}</div>
        <div class="rc-bar-wrap">
          <div class="rc-bar"><div class="rc-fill" style="width:${pct}%;background:${clr}"></div></div>
          <div class="rc-num" style="color:${clr}">${r.count}/100</div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:5px">Avg provider rank: <strong style="color:var(--text)">#${r.avg_rank}</strong> · Click to see universities</div>
        <div class="rc-unis">${unis || '<em>See XLSX for full list</em>'}</div>
      </div>`;
    }
    html += '</div>';
  }
  pane.innerHTML = html;
}

// ── 3B: GAPS ─────────────────────────────────────────────────────────────────
function renderGaps() {
  const pane = document.getElementById('pane-gaps');
  // Sort controls
  let html = `<div class="stats">
    <div class="stat"><div class="v">${SURPRISES.length}</div><div class="l">Universities with surprising absences</div></div>
    <div class="stat"><div class="v">${SURPRISES.reduce((s,x)=>s+x.missing.length,0)}</div><div class="l">Total absence instances</div></div>
    <div class="stat"><div class="v">${SURPRISES.filter(x=>x.rank<=25).length}</div><div class="l">In top 25 ranks</div></div>
  </div>
  <p style="color:var(--muted);font-size:12px;margin-bottom:14px">Universities missing programmes offered by &gt;70% of all 100. Medical-specialist institutions (Rockefeller, UCSF, Karolinska, MD Anderson) are intentionally narrow — highlighted separately.</p>
  <div class="controls">
    <input id="g-search" placeholder="Search university…" oninput="filterGaps()">
    <select id="g-prog" onchange="filterGaps()"><option value="">All missing programmes</option>${[...new Set(SURPRISES.flatMap(s=>s.missing.map(m=>m.prog)))].sort().map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
  </div>
  <div style="overflow:auto"><table id="gaps-table">
    <thead><tr>
      <th>Rank</th><th>University</th><th>Country</th><th>Total Progs</th>
      <th>Missing Programme</th><th>Cluster</th><th>Global %</th>
    </tr></thead>
    <tbody id="gaps-body"></tbody>
  </table></div>`;
  pane.innerHTML = html;
  filterGaps();
}

function filterGaps() {
  const q  = document.getElementById('g-search').value.toLowerCase();
  const gp = document.getElementById('g-prog').value;
  const tbody = document.getElementById('gaps-body');
  let rows = '';
  const MEDICAL = new Set(['Rockefeller University','Karolinska Institute','UT Southwestern Medical Center','UT MD Anderson Cancer Center','University of California, San Francisco (UCSF)']);
  for (const s of SURPRISES) {
    if (q && !s.university.toLowerCase().includes(q)) continue;
    const isMed = MEDICAL.has(s.university);
    const bg = isMed ? '#1a1a2e' : s.rank<=10 ? '#1a2038' : s.rank<=25 ? '#1a2228' : '';
    for (const m of s.missing) {
      if (gp && m.prog !== gp) continue;
      const clr = CLUSTER_COLORS[m.cluster]||'#64748B';
      rows += `<tr style="${bg?'background:'+bg:''}">
        <td style="color:#60a5fa;font-weight:700">#${s.rank}</td>
        <td>${isMed?'🏥 ':''}${s.university}</td>
        <td>${s.country}</td>
        <td style="text-align:center;color:${s.total_progs<5?'#f87171':'#94a3b8'}">${s.total_progs}</td>
        <td style="font-weight:700">${m.prog}</td>
        <td><span class="badge" style="background:${clr}">${m.cluster}</span></td>
        <td style="text-align:center;font-weight:700;color:${m.global_pct>=90?'#f87171':'#fb923c'}">${m.global_pct}%</td>
      </tr>`;
    }
  }
  document.getElementById('gaps-body').innerHTML = rows || '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">No matches</td></tr>';
}

// ── 3C: COUNTRY ──────────────────────────────────────────────────────────────

  const pane = document.getElementById('pane-country');
  const countries = Object.keys(COUNTRY_PROFILES);

  <div class="country-grid">`;

  for (const country of countries) {
    const prof = COUNTRY_PROFILES[country];
    const unitags = prof.unis ? prof.unis.slice(0,3).map(u=>`<span style="font-size:10px;color:var(--muted)">${u}</span>`).join(', ') : '';
    html += `<div class="cc">
      <div class="cc-header">
        <div class="cc-name">${country}</div>

    if (prof.strengths.length) {
      html += `<div class="cc-section"><span class="cc-section-label sig-label">▲ Strengths</span>`;
      for (const e of prof.strengths) {
        const clr = CLUSTER_COLORS[e.cluster]||'#64748B';
        html += `<div class="cc-entry">
          <span class="cluster-dot" style="background:${clr}"></span>
          <span class="cc-prog">${e.programme}</span>
          <span class="cc-pcts">${e.country_pct}% vs ${e.global_pct}%</span>
          <span class="cc-lift lift-pos">+${e.lift}</span>
        </div>`;
      }
      html += '</div>';
    }
    if (prof.weaknesses.length) {
      html += `<div class="cc-section"><span class="cc-section-label weak-label">▼ Gaps</span>`;
      for (const e of prof.weaknesses) {
        const clr = CLUSTER_COLORS[e.cluster]||'#64748B';
        html += `<div class="cc-entry">
          <span class="cluster-dot" style="background:${clr}"></span>
          <span class="cc-prog">${e.programme}</span>
          <span class="cc-pcts">${e.country_pct}% vs ${e.global_pct}%</span>
          <span class="cc-lift lift-neg">${e.lift}</span>
        </div>`;
      }
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  pane.innerHTML = html;
}

// init
renderRarity();
</script>
</body>
</html>
