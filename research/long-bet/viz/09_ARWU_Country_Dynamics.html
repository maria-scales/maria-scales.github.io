<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARWU Country Dynamics, 2003 to 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0F172A;
    color: #E2E8F0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 32px 28px 48px;
    min-height: 100vh;
  }

  h1 {
    font-size: 1.65rem;
    font-weight: 700;
    color: #F8FAFC;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 0.85rem;
    color: #64748B;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  /* TABS */
  .tab-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    border-bottom: 1px solid #334155;
    margin-bottom: 28px;
  }
  .tab-btn {
    padding: 9px 20px;
    background: transparent;
    border: none;
    color: #64748B;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.01em;
    text-align: left;
  }
  .tab-btn:hover { color: #CBD5E1; }
  .tab-btn.active { color: #F1F5F9; border-bottom-color: #60A5FA; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* TOGGLE BUTTONS */
  .toggle-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
  .toggle-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: 20px; border: 1.5px solid;
    background: transparent; cursor: pointer;
    font-size: 0.76rem; font-weight: 600; color: #CBD5E1;
    transition: opacity 0.2s; letter-spacing: 0.01em;
  }
  .toggle-btn.off { opacity: 0.3; }
  .toggle-btn.bulk { border-color: #475569; color: #94A3B8; }
  .toggle-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* CHART CARD */
  .chart-card {
    background: #1E293B; border: 1px solid #334155; border-radius: 14px;
    padding: 24px 24px 20px; margin-bottom: 28px;
  }
  .chart-wrap { position: relative; height: 480px; }

  /* CALLOUTS */
  .callouts {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px; margin-bottom: 32px;
  }
  .callout {
    background: #1E293B; border: 1px solid #334155; border-radius: 10px;
    padding: 14px 16px; border-left: 3px solid;
  }
  .callout-title { font-size: 0.82rem; font-weight: 700; color: #F1F5F9; margin-bottom: 4px; }
  .callout-body  { font-size: 0.75rem; color: #94A3B8; line-height: 1.5; }

  /* COUNTRY CARDS */
  .section-title {
    font-size: 1rem; font-weight: 600; color: #CBD5E1;
    margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #334155;
  }
  .countries-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
    gap: 9px; margin-bottom: 16px;
  }
  .country-card {
    background: #1E293B; border: 1px solid #334155; border-radius: 8px;
    padding: 11px 14px; display: flex; align-items: center; gap: 11px;
  }
  .country-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .country-info { flex: 1; min-width: 0; }
  .country-name { font-size: 0.86rem; font-weight: 600; color: #F1F5F9; }
  .country-uni  { font-size: 0.75rem; color: #94A3B8; margin-top: 1px; }
  .country-n    { font-size: 0.72rem; color: #64748B; margin-top: 1px; }
  .country-rank {
    font-size: 0.82rem; font-weight: 700;
    padding: 2px 9px; border-radius: 12px; background: #0F172A;
    white-space: nowrap; flex-shrink: 0;
  }

  /* NOTES */
  .note {
    font-size: 0.73rem; color: #94A3B8; background: #1E293B;
    border: 1px solid #334155; border-left: 3px solid #334155;
    border-radius: 6px; padding: 10px 14px; line-height: 1.6; margin-top: 4px;
  }
  .note strong { color: #CBD5E1; }
  .note ul { margin: 4px 0 0 18px; }
  .note li { margin-bottom: 3px; }
  .note a { color: #60A5FA; }

  /* STAT CARDS */
  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .stat-card {
    background: #1E293B; border: 1px solid #334155; border-radius: 10px;
    padding: 16px 18px; border-left: 3px solid;
  }
  .stat-label { font-size: 0.74rem; color: #94A3B8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .stat-value { font-size: 1.6rem; font-weight: 800; line-height: 1.1; margin-bottom: 4px; }
  .stat-desc  { font-size: 0.74rem; color: #94A3B8; line-height: 1.45; }

  @media (max-width: 600px) {
    body { padding: 16px 16px 32px; }
    h1 { font-size: 1.3rem; }
    .tab-btn { padding: 8px 12px; font-size: 0.82rem; }
    .chart-card { padding: 14px 12px 12px; }
    .chart-wrap { height: 380px; }
    .callouts, .stat-cards, .countries-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

const YEARS = DATA.meta.years;
const T = DATA.text;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function toggleButton(label, color, onClick) {
  const btn = el('button', 'toggle-btn');
  btn.style.borderColor = color;
  const dot = el('span', 'toggle-dot');
  dot.style.background = color;
  btn.appendChild(dot);
  btn.appendChild(document.createTextNode(label));
  btn.addEventListener('click', onClick);
  return btn;
}
function bulkButtons(container, chart, buttons) {
  [[T.show_all, false], [T.hide_all, true]].forEach(([label, hide]) => {
    const b = el('button', 'toggle-btn bulk', label);
    b.addEventListener('click', () => {
      chart.data.datasets.forEach(ds => { ds.hidden = hide; });
      buttons.forEach(x => x.classList.toggle('off', hide));
      chart.update();
    });
    container.appendChild(b);
  });
}
function fillCards(container, items, cls) {
  items.forEach(s => {
    const div = el('div', cls);
    div.style.borderLeftColor = s.color;
    div.appendChild(el('div', cls === 'callout' ? 'callout-title' : 'stat-label', s.title || s.label));
    if (cls === 'callout') {
      div.appendChild(el('div', 'callout-body', s.body));
    } else {
      const v = el('div', 'stat-value', s.value);
      v.style.color = s.color;
      div.appendChild(v);
      div.appendChild(el('div', 'stat-desc', s.desc));
    }
    container.appendChild(div);
  });
}
function fillNotes(container, heading, items) {
  const strong = el('strong', null, heading);
  container.appendChild(strong);
  const ul = el('ul');
  items.forEach(html => { const li = el('li'); li.innerHTML = html; ul.appendChild(li); });
  container.appendChild(ul);
}

document.getElementById('pageTitle').textContent = DATA.meta.title;
document.getElementById('pageSubtitle').textContent = DATA.meta.subtitle;
document.getElementById('tabBtn1').textContent = T.tab1_label;
document.getElementById('tabBtn2').textContent = T.tab2_label;
document.getElementById('gridTitle').textContent = T.grid_title;

const baseTooltip = {
  backgroundColor: '#1E293B', borderColor: '#475569', borderWidth: 1,
  titleColor: '#F1F5F9', bodyColor: '#CBD5E1', padding: 12,
  displayColors: true, boxWidth: 10, boxHeight: 10,
};
const baseScaleX = {
  grid: { color: '#1E293B66' }, border: { color: '#334155' },
  ticks: { color: '#94A3B8', font: { size: 11 }, maxRotation: 60, autoSkip: true }
};
function lineDataset(label, color, data) {
  return {
    label, data, borderColor: color, backgroundColor: color + '18',
    borderWidth: 2.2, pointRadius: 3.5, pointHoverRadius: 7,
    pointBackgroundColor: color, tension: 0.2, spanGaps: false,
  };
}

const C1 = DATA.tab1.countries;
const chart1 = new Chart(document.getElementById('chart1').getContext('2d'), {
  type: 'line',
  data: { labels: YEARS, datasets: C1.map(c => lineDataset(c.flag + ' ' + c.name, c.color, c.ranks)) },
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'nearest', intersect: true },
    plugins: {
      legend: { display: false },
      tooltip: Object.assign({}, baseTooltip, { callbacks: {
        title: items => {
          const it = items[0], c = C1[it.datasetIndex];
          return `${c.flag}  ${c.name}  ·  ${YEARS[it.dataIndex]}`;
        },
        label: item => {
          const c = C1[item.datasetIndex], i = item.dataIndex;
          return `  #${c.ranks[i]}  ${c.unis[i]}${c.tied[i] ? '  (' + T.tied_place + ')' : ''}`;
        }
      }})
    },
    scales: {
      y: {
        reverse: true, min: DATA.meta.rank_min, max: DATA.meta.rank_max,
        title: { display: true, text: T.y1_title, color: '#94A3B8', font: { size: 11 } },
        grid: { color: '#1E293B66' }, border: { color: '#334155' },
        ticks: { color: '#94A3B8', callback: v => '#' + v, stepSize: 10 }
      },
      x: baseScaleX
    }
  }
});
const tg1 = document.getElementById('toggles1');
const btns1 = C1.map((c, i) => {
  const btn = toggleButton(c.flag + ' ' + c.name, c.color, () => {
    const ds = chart1.data.datasets[i];
    ds.hidden = !ds.hidden;
    btn.classList.toggle('off', ds.hidden);
    chart1.update();
  });
  tg1.appendChild(btn);
  return btn;
});
bulkButtons(tg1, chart1, btns1);
fillCards(document.getElementById('callouts1'), DATA.tab1.callouts, 'callout');

        title: items => {
          const it = items[0], c = C2[it.datasetIndex];
          return `${c.flag}  ${c.name}  ·  ${YEARS[it.dataIndex]}`;
        },
        label: item => {
          const n = item.raw, tot = TOT[item.dataIndex];
          return `  ${n} of ${tot} ${tot === 1 ? 'institution' : 'institutions'}`;
        }
      }})
    },
    scales: {
      y: {
        min: 0,
        title: { display: true, text: T.y2_title, color: '#94A3B8', font: { size: 11 } },
        grid: { color: '#1E293B66' }, border: { color: '#334155' },
        ticks: { color: '#94A3B8', stepSize: 5 }
      },
      x: baseScaleX
    }
  }
});
const tg2 = document.getElementById('toggles2');
const btns2 = C2.map((c, i) => {
  const btn = toggleButton(c.flag + ' ' + c.name, c.color, () => {
    const ds = chart2.data.datasets[i];
    ds.hidden = !ds.hidden;
    btn.classList.toggle('off', ds.hidden);
    chart2.update();
  });
  tg2.appendChild(btn);
  return btn;
});
bulkButtons(tg2, chart2, btns2);
fillCards(document.getElementById('statCards'), DATA.tab2.stat_cards, 'stat-card');
fillCards(document.getElementById('callouts2'), DATA.tab2.callouts, 'callout');
fillNotes(document.getElementById('notes2'), T.notes_heading, DATA.tab2.notes);

// ---------- TAB SWITCHING ----------
function switchTab(id, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  setTimeout(() => { chart1.resize(); chart2.resize(); }, 10);
}
</script>
</body>
