<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEM Coverage Matrix — Top 100 ARWU Universities</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 13px; }

  header { padding: 24px 28px 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 20px; font-weight: 700; color: #f1f5f9; }
  header p  { color: var(--muted); margin-top: 4px; font-size: 12px; }

  .controls { display: flex; gap: 12px; padding: 14px 28px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); background: #0f172a; position: sticky; top: 0; z-index: 50; }
  .controls input  { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 12px; width: 200px; }
  .controls input:focus { outline: none; border-color: var(--accent); }
  .controls select { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 12px; }
  .controls label  { font-size: 12px; color: var(--muted); }
  .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .btn:hover { background: var(--border); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .stats { display: flex; gap: 16px; padding: 10px 28px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; }
  .stat .val { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 11px; color: var(--muted); }

  .matrix-wrap { overflow: auto; padding: 0 0 20px 0; }
  table { border-collapse: collapse; table-layout: fixed; min-width: max-content; }

  .col-rank  { width: 42px; }
  .col-uni   { width: 220px; }
  .col-ctry  { width: 70px; }
  .col-total { width: 50px; }
  .col-prog  { width: 28px; }

  th, td { border: 1px solid #1e293b; }

  /* Sticky header */
  thead { position: sticky; top: 0; z-index: 40; }
  .th-cluster { text-align: center; font-size: 10px; font-weight: 700; padding: 4px 2px; color: #fff; white-space: nowrap; }
  .th-prog { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 9px; font-weight: 600; padding: 8px 2px 4px; text-align: left; color: #fff; height: 100px; }
  .th-label { text-align: center; font-size: 11px; font-weight: 700; padding: 4px; color: #fff; background: #1F4E79; vertical-align: middle; }

  /* Sticky columns */
  .td-rank, .th-rank { position: sticky; left: 0; z-index: 20; background: #1e293b; }
  .td-uni,  .th-uni  { position: sticky; left: 42px; z-index: 20; background: #1e293b; }
  .td-ctry, .th-ctry { position: sticky; left: 262px; z-index: 20; background: #1e293b; }
  thead .td-rank, thead .th-rank,
  thead .td-uni,  thead .th-uni,
  thead .td-ctry, thead .th-ctry { z-index: 45; }

  .td-rank  { text-align: center; font-weight: 700; color: #60a5fa; padding: 4px; font-size: 11px; }
  .td-uni   { padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  .td-ctry  { text-align: center; padding: 4px 2px; font-size: 10px; font-weight: 600; }
  .td-total { text-align: center; font-weight: 700; font-size: 12px; }
  .td-prog  { text-align: center; font-size: 13px; padding: 1px; }

  tr.highlight { outline: 2px solid var(--accent); }
  tr:hover td { filter: brightness(1.15); }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px 28px 8px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; }
  .legend-dot  { width: 12px; height: 12px; border-radius: 3px; }

  .note { color: var(--muted); font-size: 11px; padding: 4px 28px 12px; }

  /* Breadth view */
  #breadth-view { display: none; padding: 20px 28px; }
  .breadth-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .breadth-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .breadth-card .bc-rank { font-size: 11px; color: var(--muted); }
  .breadth-card .bc-name { font-size: 14px; font-weight: 600; margin: 2px 0 8px; }
  .bc-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .bc-bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .bc-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg,#3b82f6,#60a5fa); }
  .bc-num { font-size: 13px; font-weight: 700; color: #60a5fa; min-width: 30px; text-align: right; }
  .bc-clusters { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .bc-cl { font-size: 10px; padding: 2px 6px; border-radius: 10px; color: #fff; font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>STEM Programme Coverage Matrix</h1>
  <p>Top 100 ARWU-ranked universities · 31 canonical programmes · 13 subject clusters · A record = one (university × programme) pair offering STEM study.</p>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="Search university…">
  <select id="filter-country">
    <option value="">All countries</option>
  </select>
  <select id="filter-cluster">
    <option value="">All clusters</option>
  </select>
  <label><input type="checkbox" id="hide-empty"> Hide universities with &lt;5 programmes</label>
  <button class="btn active" id="btn-matrix" onclick="showView('matrix')">Heatmap</button>
  <button class="btn" id="btn-breadth" onclick="showView('breadth')">Breadth Ranking</button>
</div>

<div class="stats" id="stats-row"></div>

<div class="legend" id="legend-row"></div>
<div class="note">★ Highlighted columns = programmes offered by ≥80 universities &nbsp;|&nbsp; Cell colour matches subject cluster</div>

<div id="matrix-view">
  <div class="matrix-wrap">
    <table id="main-table"></table>
  </div>
</div>

<div id="breadth-view">
  <div class="breadth-grid" id="breadth-grid"></div>
</div>

// Stats
function updateStats(filtered) {
  const totalProgs = filtered.reduce((s,u)=>s+u.progs.reduce((a,b)=>a+b,0),0);
  const avgBreadth = filtered.length ? (filtered.reduce((s,u)=>s+u.progs.reduce((a,b)=>a+b,0),0)/filtered.length).toFixed(1) : 0;
  const maxBreadth = filtered.length ? Math.max(...filtered.map(u=>u.progs.reduce((a,b)=>a+b,0))) : 0;
  document.getElementById('stats-row').innerHTML = `
    <div class="stat"><div class="val">${filtered.length}</div><div class="lbl">Universities shown</div></div>
    <div class="stat"><div class="val">${totalProgs}</div><div class="lbl">Total (uni×prog) pairs</div></div>
    <div class="stat"><div class="val">${avgBreadth}</div><div class="lbl">Avg programmes/uni</div></div>
    <div class="stat"><div class="val">${maxBreadth}</div><div class="lbl">Max breadth (programmes)</div></div>
  `;
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const c = document.getElementById('filter-country').value;
  const cl = document.getElementById('filter-cluster').value;
  const hideSmall = document.getElementById('hide-empty').checked;
  return unis.filter(u => {
    if (q && !u.name.toLowerCase().includes(q)) return false;
    if (c && u.country !== c) return false;
    if (cl) { const idx=clPIdx[cl]; if (!idx.some(i=>u.progs[i])) return false; }
    if (hideSmall && u.progs.reduce((a,b)=>a+b,0) < 5) return false;
    return true;
  });
}

    const indices = clPIdx[cl];
    const th = document.createElement('th');
    th.colSpan = indices.length;
    th.className = 'th-cluster';
    th.style.background = CLUSTER_COLORS[cl];
    th.textContent = cl;
    r0.appendChild(th);
  });
  // Total
  const thTot = document.createElement('th');
  thTot.rowSpan=2; thTot.textContent='Total'; thTot.className='th-label';
  thTot.style.background='#1F4E79'; thTot.style.width='50px';
  r0.appendChild(thTot);

  // Programme header row
  const r1 = head.insertRow();
  progs.forEach((p,i) => {
    const th = document.createElement('th');
    th.className='th-prog col-prog';
    th.style.background = CLUSTER_COLORS[p.cluster];
    th.title = `${p.name} — offered by ${progFreq[i]} universities`;
    const inner = document.createElement('span');
    inner.textContent = p.name;
    if (progFreq[i] >= 80) inner.style.textDecoration = 'underline';
    th.appendChild(inner);
    r1.appendChild(th);
  });

  // Body
  const body = tbl.createTBody();
  filtered.forEach(u => {
    const tr = body.insertRow();
    const total = u.progs.reduce((a,b)=>a+b,0);
    const ctryBg = COUNTRY_BG[u.country] || '#1e293b';

    // Rank
    const tdR = tr.insertCell(); tdR.className='td-rank'; tdR.textContent='#'+u.rank; tdR.style.background='#1e293b';
    // Uni
    const tdU = tr.insertCell(); tdU.className='td-uni'; tdU.textContent=u.name; tdU.title=u.name; tdU.style.background='#1e293b';
    // Country
    const tdC = tr.insertCell(); tdC.className='td-ctry'; tdC.textContent=u.country; tdC.style.background=ctryBg;

    // Prog cells
    u.progs.forEach((v,i) => {
      const td = tr.insertCell();
      td.className='td-prog col-prog';
      if (v) {
        const clr = CLUSTER_COLORS[progs[i].cluster];
        td.textContent='✓';
        td.style.background = clr + '33';
        td.style.color = clr;
        td.title = `${u.name} · ${progs[i].name}`;
      } else {
        td.style.background = '#111827';
      }
    });

    // Total
    const tdT = tr.insertCell();
    tdT.className='td-total';
    tdT.textContent=total;
    tdT.style.color = total>=18?'#f87171':total>=14?'#fb923c':'#60a5fa';
    tdT.style.background='#1e293b';
  });
}

function buildBreadth(filtered) {
  const grid = document.getElementById('breadth-grid');
  grid.innerHTML = '';
  const sorted = [...filtered].sort((a,b)=>b.progs.reduce((s,v)=>s+v,0)-a.progs.reduce((s,v)=>s+v,0));
  sorted.forEach(u => {
    const total = u.progs.reduce((a,b)=>a+b,0);
    const clsCovered = clusters.filter(cl=>clPIdx[cl].some(i=>u.progs[i]));
    const card = document.createElement('div');
    card.className='breadth-card';
    card.innerHTML = `
      <div class="bc-rank">#${u.rank} · ${u.country}</div>
      <div class="bc-name">${u.name}</div>
      <div class="bc-bar-wrap">
        <div class="bc-bar"><div class="bc-fill" style="width:${(total/31*100).toFixed(0)}%"></div></div>
        <div class="bc-num">${total}/31</div>
      </div>
      <div class="bc-clusters">${clsCovered.map(cl=>`<span class="bc-cl" style="background:${CLUSTER_COLORS[cl]}">${cl.replace('Engineering – ','Eng–').replace('Computational Biology & Bioinformatics','CompBio').replace('Earth & Environmental Sciences','Earth/Env').replace('Physics & Astronomy','Phys/Astro')}</span>`).join('')}</div>
    `;
    grid.appendChild(card);
  });
}

function render() {
  const filtered = getFiltered();
  updateStats(filtered);
  if (document.getElementById('matrix-view').style.display !== 'none') buildTable(filtered);
  else buildBreadth(filtered);
}

function showView(v) {
  document.getElementById('matrix-view').style.display = v==='matrix' ? '' : 'none';
  document.getElementById('breadth-view').style.display = v==='breadth' ? '' : 'none';
  document.getElementById('btn-matrix').classList.toggle('active', v==='matrix');
  document.getElementById('btn-breadth').classList.toggle('active', v==='breadth');
  render();
}

['search','filter-country','filter-cluster','hide-empty'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

render();
</script>
</body>
</html>
