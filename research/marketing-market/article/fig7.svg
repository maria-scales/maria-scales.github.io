<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 354" width="800" height="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Liberation Sans', 'DejaVu Sans', sans-serif" role="img" aria-label="Marketing is the most open door of the four — which is not the same as open">
<rect width="800" height="354" fill="#ffffff"/>
<text x="32" y="38" font-size="19" font-weight="600" fill="#111827">Marketing is the most open door of the four — which is not the same as open</text>
<text x="32" y="60" font-size="13" fill="#6b7280">Entry-level share of postings that state a level in the title</text>
<text x="158" y="115.0" font-size="13" text-anchor="end" fill="#111827">My disciplines</text>
<g fill="#2563eb"><path d="M170,100 h366.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-366.0 z"/></g>
<text x="548.0" y="115.0" font-size="13" font-weight="600" fill="#111827">20%</text>
<text x="581.116" y="115.0" font-size="12" fill="#6b7280">1 entry per 4 senior+</text>
<text x="158" y="151.0" font-size="13" text-anchor="end" fill="#111827">Marketing</text>
<g fill="#2563eb"><path d="M170,136 h310.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-310.5 z"/></g>
<text x="492.5" y="151.0" font-size="13" font-weight="600" fill="#111827">17%</text>
<text x="525.616" y="151.0" font-size="12" fill="#6b7280">1 per 5</text>
<text x="158" y="187.0" font-size="13" text-anchor="end" fill="#111827">Data</text>
<g fill="#cbd5e1"><path d="M170,172 h84.8 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-84.8 z"/></g>
<text x="266.8" y="187.0" font-size="13" font-weight="600" fill="#111827">4.8%</text>
<text x="308.288" y="187.0" font-size="12" fill="#6b7280">1 per 20</text>
<text x="158" y="223.0" font-size="13" text-anchor="end" fill="#111827">Product</text>
<g fill="#cbd5e1"><path d="M170,208 h81.1 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-81.1 z"/></g>
<text x="263.1" y="223.0" font-size="13" font-weight="600" fill="#111827">4.6%</text>
<text x="304.588" y="223.0" font-size="12" fill="#6b7280">1 per 21</text>
<text x="158" y="259.0" font-size="13" text-anchor="end" fill="#111827">Engineering</text>
<g fill="#cbd5e1"><path d="M170,244 h71.85 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-71.85 z"/></g>
<text x="253.85" y="259.0" font-size="13" font-weight="600" fill="#111827">4.1%</text>
<text x="295.33799999999997" y="259.0" font-size="12" fill="#6b7280">1 per 23</text>
<line x1="170" y1="94" x2="170" y2="272" stroke="#e5e7eb" stroke-width="1"/>
<text x="32" y="290" font-size="12" fill="#6b7280">Entry = intern, junior, associate, assistant, working student, trainee. Roughly 40–60% of postings name no</text>
<text x="32" y="306" font-size="12" fill="#6b7280">level and are excluded.</text>
<text x="32" y="338" font-size="11" fill="#6b7280">Source: author&#x27;s job-search database, 18,436 open postings at 590 companies, 6 Jul – 26 Aug 2026. mariascales.com</text>
</svg>